name: Build Android APK

# Push a tag like v1.0.0 to build the APK and attach it to a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Copy web files into www/
        run: |
          mkdir www
          cp index.html script.js style.css www/

      - name: Create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk calculator.apk
          gh release create "$GITHUB_REF_NAME" calculator.apk \
            --title "Calculator $GITHUB_REF_NAME" \
            --notes "Android APK. Download calculator.apk and install it on your phone."
